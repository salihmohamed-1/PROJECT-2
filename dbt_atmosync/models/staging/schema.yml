version: 2

models:
  - name: stg_telemetry
    description: "Cleaned and deduplicated streaming IoT telemetry events."
    columns:
      - name: event_id
        tests:
          - unique
          - not_null
      - name: container_id
        tests:
          - not_null
      - name: temperature
        tests:
          - not_null
      - name: humidity
        tests:
          - not_null

  - name: stg_commodity_pricing
    description: "Cleaned spot commodity prices per regional market."
    columns:
      - name: commodity
        tests:
          - not_null
      - name: market
        tests:
          - not_null
      - name: price_per_unit_inr
        tests:
          - not_null
